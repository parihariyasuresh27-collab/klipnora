
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Reset your Klipnora account password.">

    <title>Reset Password - Klipnora</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        header nav a {
            color: #d1d1dc;
            font-weight: 700;
            text-decoration: none;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            transition: 0.3s ease;
        }

        header nav a:hover {
            color: #a78bfa;
        }

        header nav a.active {
            color: #a78bfa;
            border-bottom-color: #a78bfa;
        }

        header .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #c4b5fd, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.25));
        }

        header nav a[href="login.html"] {
            color: #ffffff;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            padding: 9px 18px;
            border: 1px solid #a78bfa;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.25);
        }

        header nav a[href="login.html"]:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.45);
        }

        .reset-section {
            min-height: 75vh;
            padding: 70px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(
                ellipse at top,
                #291849 0%,
                #11101c 45%,
                #09090f 100%
            );
        }

        .reset-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #151520;
            border: 1px solid #353047;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .reset-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-heading h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .reset-heading p {
            color: #9999aa;
            font-size: 15px;
            line-height: 1.6;
        }

        .reset-form .form-group {
            margin-bottom: 22px;
        }

        .reset-form label {
            display: block;
            margin-bottom: 9px;
            color: #e2e2ec;
            font-size: 14px;
            font-weight: 600;
        }

        .reset-form input {
            width: 100%;
            padding: 14px 15px;
            background: #0d0d16;
            color: #ffffff;
            border: 1px solid #353547;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s ease;
        }

        .reset-form input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .password-help {
            color: #9999aa;
            font-size: 12px;
            margin-top: 7px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b5b5c5;
            font-size: 13px;
            margin-bottom: 22px;
            cursor: pointer;
        }

        .show-password input {
            width: auto;
            accent-color: #8b5cf6;
        }

        .reset-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #ffffff;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .reset-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(139, 92, 246, 0.3);
        }

        .reset-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            text-align: center;
            font-size: 13px;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #a78bfa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            color: #c4b5fd;
        }

        @media (max-width: 768px) {
            .reset-container {
                padding: 30px 22px;
            }

            .reset-heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Klipnora.</div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../features.html">Features</a>
            <a href="../pricing.html">Pricing</a>
            <a href="../about.html">About</a>
            <a href="../contact.html">Contact</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <section class="reset-section">

        <div class="reset-container">

            <div class="reset-heading">
                <h1>Reset Password</h1>

                <p>
                    Create a new password for your Klipnora account.
                </p>
            </div>

            <form class="reset-form" id="reset-form">

                <div class="form-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <p class="password-help">
                        Password must contain at least 8 characters.
                    </p>

                </div>

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <label class="show-password">
                    <input type="checkbox" id="show-password">
                    Show Password
                </label>

                <button type="submit" class="reset-submit">
                    Reset Password
                </button>

                <div class="reset-message" id="reset-message" role="status"></div>

            </form>

            <a href="login.html" class="back-login">
                ← Back to Login
            </a>

        </div>

    </section>

    <footer>

        <div class="footer-bottom">

            <p>
                &copy; <span id="current-year"></span> Klipnora.
                All Rights Reserved.
            </p>

        </div>

    </footer>

    <script>

        document.getElementById("current-year").textContent =
            new Date().getFullYear();

        const newPassword = document.getElementById("new-password");
        const confirmPassword = document.getElementById("confirm-password");
        const showPassword = document.getElementById("show-password");
        const resetForm = document.getElementById("reset-form");
        const resetMessage = document.getElementById("reset-message");

        showPassword.addEventListener("change", function() {

            const inputType = this.checked ? "text" : "password";

            newPassword.type = inputType;
            confirmPassword.type = inputType;

        });

        resetForm.addEventListener("submit", function(event) {

            event.preventDefault();

            resetMessage.style.display = "block";

            if (newPassword.value !== confirmPassword.value) {

                resetMessage.textContent =
                    "Passwords do not match. Please try again.";

                return;

            }

            /*
              FRONTEND DEMO ONLY

              No actual password is changed here.
              Real password reset will be implemented
              during backend development.
            */

            resetMessage.textContent =
                "Demo only: Opening Login page...";

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);

        });

    </script>

</body>
</html>
