
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Klipnora</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        header nav a {
            color: #d1d1dc;
            font-weight: 700;
            text-decoration: none;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            transition: 0.3s ease;
        }

        header nav a:hover {
            color: #a78bfa;
        }

        header nav a.active {
            color: #a78bfa;
            border-bottom-color: #a78bfa;
        }

        header .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #c4b5fd, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.25));
        }

        header nav a[href="login.html"] {
            color: #ffffff;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            padding: 9px 18px;
            border: 1px solid #a78bfa;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.25);
        }

        header nav a[href="login.html"]:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.45);
        }

        .forgot-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
            background: #151520;
            border: 1px solid #29293a;
            border-radius: 15px;
            text-align: center;
        }

        .forgot-container h1 {
            color: #ffffff;
            margin-bottom: 12px;
        }

        .forgot-container p {
            color: #b5b5c5;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .forgot-container label {
            display: block;
            color: #d1d1dc;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .forgot-container input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            background: #09090f;
            border: 1px solid #38384c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
        }

        .forgot-container input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .forgot-container button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot-container button:hover {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }

        .back-login {
            display: inline-block;
            margin-top: 22px;
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }

        .back-login:hover {
            color: #c4b5fd;
        }

        #recovery-message {
            margin-top: 18px;
            color: #a78bfa;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .forgot-container {
                margin: 40px 15px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Klipnora.</div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../features.html">Features</a>
            <a href="../pricing.html">Pricing</a>
            <a href="../about.html">About</a>
            <a href="../contact.html">Contact</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <main>
        <div class="forgot-container">

            <h1>Forgot Password?</h1>

            <p>
                Don't worry! Enter your registered email address
                or mobile number to start the password recovery process.
            </p>

            <form id="forgot-form">

                <label for="emailOrMobile">
                    Email Address or Mobile Number
                </label>

                <input
                    type="text"
                    id="emailOrMobile"
                    name="emailOrMobile"
                    placeholder="Enter email or mobile number"
                    autocomplete="username"
                    required
                >

                <button type="submit">
                    Recover Password
                </button>

            </form>

            <div id="recovery-message" role="status"></div>

            <a href="login.html" class="back-login">
                ← Back to Login
            </a>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="current-year"></span> Klipnora.
            All rights reserved.
        </p>
    </footer>

    <script>
        document.getElementById("current-year").textContent =
            new Date().getFullYear();

        document.getElementById("forgot-form").addEventListener("submit", function(event) {

            event.preventDefault();

            const contact = document.getElementById("emailOrMobile").value.trim();
            const message = document.getElementById("recovery-message");

            if (!contact) {
                message.textContent = "Please enter your email or mobile number.";
                return;
            }

            /*
              FRONTEND DEMO ONLY

              This does not send a real OTP.
              The flow parameter tells the next page
              that this is a password recovery request.
            */

            message.textContent =
                "Demo only: Opening OTP Verification page...";

            setTimeout(function() {
                window.location.href = "verify-otp.html?flow=reset";
            }, 1000);

        });
    </script>

</body>
</html>
